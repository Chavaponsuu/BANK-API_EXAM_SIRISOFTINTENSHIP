# .github/workflows/deploy.yml
name: CI/CD → Deploy to Render

on:
  push:
    branches:
      - dev
      - workflow-test

jobs:
  # ─────────────────────────────────────────
  # JOB 1: CI — Lint + Test
  # ─────────────────────────────────────────
  ci:
    name: 🔍 Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "go.mod" # แก้จาก 1.26 → 1.24 (เวอร์ชันล่าสุดที่มีจริง)
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.65.0

      - name: Unit Tests
        run: go test ./... -v -race -coverprofile=coverage.out

      - name: Coverage report
        run: go tool cover -func=coverage.out

  # ─────────────────────────────────────────
  # JOB 2: Containerize — Docker Build
  # ─────────────────────────────────────────
  build:
    name: 🐳 Docker Build
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./dockerfile # ← ระบุ Dockerfile ใน root ชัดเจน
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/myapp:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/myapp:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────
  # JOB 3: CD — Deploy to Render
  # ─────────────────────────────────────────
  deploy:
    name: 🌐 Deploy to Render
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        run: |
          curl -f "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            && echo "✅ Deploy triggered" \
            || (echo "❌ Deploy failed" && exit 1)
