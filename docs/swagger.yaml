basePath: /api/v1
definitions:
  github_com_krizad_go-gin-api_internal_adapters_http_dto.AccountResponse:
    properties:
      account_number:
        type: string
      account_type:
        example: SAVING
        type: string
      balance:
        example: 1000
        type: number
      owner_name:
        example: John Doe
        type: string
      status:
        example: ACTIVE
        type: string
    type: object
  github_com_krizad_go-gin-api_internal_adapters_http_dto.BaseResponse:
    properties:
      data: {}
      errors:
        items: {}
        type: array
      message:
        type: string
      meta:
        $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.Meta'
      success:
        type: boolean
    type: object
  github_com_krizad_go-gin-api_internal_adapters_http_dto.CloseAccountResponse:
    properties:
      account_number:
        type: string
      status:
        type: string
    type: object
  github_com_krizad_go-gin-api_internal_adapters_http_dto.CreateAccountRequest:
    properties:
      account_type:
        enum:
        - SAVING
        - CURRENT
        type: string
      citizen_id:
        type: string
      initial_balance:
        minimum: 0
        type: number
      owner_name:
        type: string
      phone_number:
        type: string
    required:
    - account_type
    - citizen_id
    - owner_name
    - phone_number
    type: object
  github_com_krizad_go-gin-api_internal_adapters_http_dto.CreateExampleRequest:
    properties:
      email:
        example: john@example.com
        type: string
      name:
        example: John Doe
        type: string
    required:
    - email
    - name
    type: object
  github_com_krizad_go-gin-api_internal_adapters_http_dto.ExampleDeleteResponse:
    properties:
      id:
        type: integer
    type: object
  github_com_krizad_go-gin-api_internal_adapters_http_dto.ExampleResponse:
    properties:
      created_at:
        example: "2024-01-01T00:00:00Z"
        type: string
      email:
        example: john@example.com
        type: string
      id:
        example: 1
        type: integer
      name:
        example: John Doe
        type: string
      updated_at:
        example: "2024-01-01T00:00:00Z"
        type: string
    type: object
  github_com_krizad_go-gin-api_internal_adapters_http_dto.Meta:
    properties:
      page:
        type: integer
      per_page:
        type: integer
      total:
        type: integer
    type: object
  github_com_krizad_go-gin-api_internal_adapters_http_dto.PatchExampleRequest:
    properties:
      email:
        example: john@example.com
        type: string
      name:
        example: John Doe
        type: string
    type: object
  github_com_krizad_go-gin-api_internal_adapters_http_dto.TransactionRequest:
    properties:
      amount:
        type: number
      description:
        maxLength: 255
        type: string
    type: object
  github_com_krizad_go-gin-api_internal_adapters_http_dto.TransactionResponse:
    properties:
      amount:
        type: number
      balance_after:
        type: number
      balance_before:
        type: number
      created_at:
        type: string
      description:
        type: string
      transaction_ref:
        type: string
      transaction_type:
        type: string
    type: object
  github_com_krizad_go-gin-api_internal_adapters_http_dto.UpdateExampleRequest:
    properties:
      email:
        example: john@example.com
        type: string
      name:
        example: John Doe
        type: string
    required:
    - email
    - name
    type: object
host: localhost:8080
info:
  contact:
    email: support@example.com
    name: API Support
    url: http://www.example.com/support
  description: CRUD API built with Go and Gin framework, connected to PostgreSQL.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Go Gin Example API
  version: "1.0"
paths:
  /accounts:
    get:
      description: Retrieve a paginated list of all accounts ordered by ID.
      parameters:
      - default: 1
        description: 'Page number (default: 1, min: 1)'
        in: query
        name: page
        type: integer
      - default: 10
        description: 'Items per page (default: 10, max: 100)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: List of accounts with pagination metadata
          schema:
            allOf:
            - $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.BaseResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.AccountResponse'
                  type: array
                meta:
                  $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.Meta'
              type: object
        "400":
          description: Invalid page or limit parameters
          schema:
            $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.BaseResponse'
        "500":
          description: Failed to get account list
          schema:
            $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.BaseResponse'
      summary: List all accounts with pagination
      tags:
      - accounts
    post:
      consumes:
      - application/json
      description: Create a new bank account record. If initial_balance > 0, creates
        a DEPOSIT transaction atomically.
      parameters:
      - description: Account payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.CreateAccountRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Account created successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.AccountResponse'
              type: object
        "400":
          description: 'Invalid input: citizen_id must be 13 digits, account_type
            must be SAVING or CURRENT, or balance cannot be negative'
          schema:
            $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.BaseResponse'
        "409":
          description: Citizen ID already exists
          schema:
            $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.BaseResponse'
        "500":
          description: Failed to create account
          schema:
            $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.BaseResponse'
      summary: Create a new account
      tags:
      - accounts
  /accounts/{account_number}:
    get:
      description: Retrieve account details by 10-digit account number.
      parameters:
      - description: Account Number (10 digits)
        in: path
        name: account_number
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Account found
          schema:
            allOf:
            - $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.AccountResponse'
              type: object
        "400":
          description: Invalid account_number format
          schema:
            $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.BaseResponse'
        "404":
          description: Account not found
          schema:
            $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.BaseResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.BaseResponse'
      summary: Get account by account number
      tags:
      - accounts
  /accounts/{account_number}/close:
    patch:
      description: Change account status from ACTIVE to CLOSED. Closed accounts cannot
        perform transactions (deposit/withdraw).
      parameters:
      - description: Account Number (10 digits)
        in: path
        name: account_number
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Account closed successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.CloseAccountResponse'
              type: object
        "400":
          description: Invalid account number format
          schema:
            $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.BaseResponse'
        "404":
          description: Account not found
          schema:
            $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.BaseResponse'
        "409":
          description: Account is already closed
          schema:
            $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.BaseResponse'
        "500":
          description: Failed to close account
          schema:
            $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.BaseResponse'
      summary: Close an account
      tags:
      - accounts
  /accounts/{account_number}/deposit:
    post:
      consumes:
      - application/json
      description: Deposit a specified amount into the account. Creates a DEPOSIT
        transaction and updates account balance atomically.
      parameters:
      - description: Account Number (10 digits)
        in: path
        name: account_number
        required: true
        type: string
      - description: Deposit request payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.TransactionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Deposit successful
          schema:
            allOf:
            - $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.TransactionResponse'
              type: object
        "400":
          description: Amount must be greater than 0
          schema:
            $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.BaseResponse'
        "404":
          description: Account not found
          schema:
            $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.BaseResponse'
        "409":
          description: Account is not active or already closed
          schema:
            $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.BaseResponse'
        "500":
          description: Failed to update account balance
          schema:
            $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.BaseResponse'
      summary: Deposit money into an account
      tags:
      - transactions
  /accounts/{account_number}/transactions:
    get:
      description: Retrieve paginated transaction history for an account, ordered
        by newest first (created_at DESC).
      parameters:
      - description: Account Number (10 digits)
        in: path
        name: account_number
        required: true
        type: string
      - default: 1
        description: 'Page number (default: 1, min: 1)'
        in: query
        name: page
        type: integer
      - default: 10
        description: 'Items per page (default: 10, max: 100)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Transaction history with pagination
          schema:
            allOf:
            - $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.BaseResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.TransactionResponse'
                  type: array
                meta:
                  $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.Meta'
              type: object
        "400":
          description: Invalid account_number format or pagination parameters
          schema:
            $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.BaseResponse'
        "404":
          description: Account not found
          schema:
            $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.BaseResponse'
        "500":
          description: Failed to get transaction history
          schema:
            $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.BaseResponse'
      summary: Get transaction history of an account
      tags:
      - transactions
  /accounts/{account_number}/withdraw:
    post:
      consumes:
      - application/json
      description: Withdraw a specified amount from the account. Validates sufficient
        balance, creates a WITHDRAW transaction, and updates account balance atomically.
      parameters:
      - description: Account Number (10 digits)
        in: path
        name: account_number
        required: true
        type: string
      - description: Withdraw request payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.TransactionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Withdrawal successful
          schema:
            allOf:
            - $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.TransactionResponse'
              type: object
        "400":
          description: Insufficient balance or amount must be greater than 0
          schema:
            $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.BaseResponse'
        "404":
          description: Account not found
          schema:
            $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.BaseResponse'
        "409":
          description: Account is not active or already closed
          schema:
            $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.BaseResponse'
        "500":
          description: Failed to update account balance
          schema:
            $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.BaseResponse'
      summary: Withdraw money from an account
      tags:
      - transactions
  /examples:
    get:
      description: Retrieve a list of all example records.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.BaseResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.ExampleResponse'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.BaseResponse'
      summary: List all examples
      tags:
      - examples
    post:
      consumes:
      - application/json
      description: Create a new example record.
      parameters:
      - description: Example payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.CreateExampleRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.ExampleResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.BaseResponse'
      summary: Create a new example
      tags:
      - examples
  /examples/{id}:
    delete:
      description: Delete an example record by ID.
      parameters:
      - description: Example ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.ExampleDeleteResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.BaseResponse'
      summary: Delete an example
      tags:
      - examples
    get:
      description: Retrieve a single example by its ID.
      parameters:
      - description: Example ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.ExampleResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.BaseResponse'
      summary: Get an example by ID
      tags:
      - examples
    patch:
      consumes:
      - application/json
      description: Partially update fields of an existing example by ID.
      parameters:
      - description: Example ID
        in: path
        name: id
        required: true
        type: integer
      - description: Fields to patch
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.PatchExampleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.ExampleResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.BaseResponse'
      summary: Partial update an example
      tags:
      - examples
    put:
      consumes:
      - application/json
      description: Fully replace an existing example by ID.
      parameters:
      - description: Example ID
        in: path
        name: id
        required: true
        type: integer
      - description: Example payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.UpdateExampleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.ExampleResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.BaseResponse'
      summary: Update an example
      tags:
      - examples
  /examples/search:
    get:
      description: Search for an example record by email query parameter.
      parameters:
      - description: Email address
        in: query
        name: email
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.ExampleResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.BaseResponse'
      summary: Find example by email
      tags:
      - examples
  /health:
    get:
      description: Returns the health status of the API and database connectivity.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.BaseResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/github_com_krizad_go-gin-api_internal_adapters_http_dto.BaseResponse'
      summary: API health check
      tags:
      - health
swagger: "2.0"
